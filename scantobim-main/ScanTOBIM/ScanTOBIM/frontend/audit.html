<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanToBIM — Audit Chain</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/ui/js/api.js"></script>
</head>
<body class="bg-gray-50 text-gray-800" x-data="auditApp()" x-init="init()">

<div class="flex h-screen overflow-hidden">

  <!-- Mobile overlay -->
  <div x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"
       class="fixed inset-0 bg-black/50 z-20 lg:hidden"></div>

  <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
         class="fixed inset-y-0 left-0 z-30 w-56 bg-slate-800 text-slate-100 flex flex-col flex-shrink-0 transform transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0">
    <div class="h-16 flex items-center px-5 border-b border-slate-700">
      <svg class="w-6 h-6 text-indigo-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
      </svg>
      <span class="font-semibold text-sm">ScanToBIM</span>
    </div>
    <nav class="flex-1 py-4 px-2 space-y-0.5 text-sm">
      <a href="/ui/dashboard.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/ui/sessions.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        Sessions
      </a>
      <a href="/ui/gates.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        Safety Gates
      </a>
      <a href="/ui/ncrs.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        NCRs
      </a>
      <a href="/ui/audit.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-700 text-white font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Audit Chain
      </a>
    </nav>
    <div class="border-t border-slate-700 p-4">
      <div class="flex items-center gap-2 mb-2">
        <div class="w-7 h-7 rounded-full bg-indigo-500 flex items-center justify-center text-xs font-bold uppercase"
          x-text="(user?.username || 'U')[0]"></div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-medium truncate" x-text="user?.username || '—'"></p>
          <p class="text-xs text-slate-400 capitalize" x-text="user?.role || ''"></p>
        </div>
      </div>
      <button onclick="auth.logout()" class="w-full text-xs text-slate-400 hover:text-white text-left">Sign out</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto">
    <!-- Mobile top bar -->
    <div class="sticky top-0 z-10 lg:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 shadow-sm">
      <button @click="sidebarOpen = true" class="text-gray-600 hover:text-gray-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-semibold text-gray-800 text-sm">ScanToBIM</span>
    </div>
    <div class="max-w-5xl mx-auto px-6 py-8">

      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Audit Chain</h1>
          <p class="text-sm text-gray-500 mt-0.5">HMAC-SHA256 tamper-evident event log (NQA-1 / ISO 19650)</p>
        </div>
        <div class="flex items-center gap-3">
          <select x-model="selectedSession" @change="loadAudit()"
            class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="">Select a session…</option>
            <template x-for="s in sessions" :key="s.session_id">
              <option :value="s.session_id" x-text="s.site_name || shortId(s.session_id)"></option>
            </template>
          </select>
          <button @click="verifyChain()" :disabled="!selectedSession || verifying"
            class="text-sm bg-white border border-gray-300 hover:border-indigo-400 text-gray-700 px-3 py-2 rounded-lg font-medium disabled:opacity-50">
            <span x-text="verifying ? 'Verifying…' : 'Verify Chain'"></span>
          </button>
        </div>
      </div>

      <!-- Chain Integrity Banner -->
      <template x-if="chainResult">
        <div class="rounded-xl border p-4 mb-6 flex items-center gap-3"
          :class="chainResult.valid ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-300'">
          <svg class="w-5 h-5 flex-shrink-0"
            :class="chainResult.valid ? 'text-green-500' : 'text-red-500'"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path x-show="chainResult.valid" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            <path x-show="!chainResult.valid" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          <div>
            <p class="font-medium text-sm" :class="chainResult.valid ? 'text-green-800' : 'text-red-800'"
              x-text="chainResult.valid ? '✓ Chain integrity verified — no tampering detected' : '⚠ Chain integrity FAILED — possible tampering'">
            </p>
            <p class="text-xs mt-0.5"
              :class="chainResult.valid ? 'text-green-600' : 'text-red-600'"
              x-text="`${chainResult.event_count || 0} events · ${chainResult.broken_links || 0} broken links`">
            </p>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!selectedSession && !loading">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-10 text-center">
          <svg class="w-10 h-10 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <p class="text-gray-400">Select a session to view its audit trail</p>
        </div>
      </template>

      <!-- Event Timeline -->
      <template x-if="selectedSession">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
            <h2 class="font-semibold text-gray-800 text-sm">Audit Events</h2>
            <span class="text-xs text-gray-400" x-text="`${events.length} events`"></span>
          </div>

          <template x-if="loading">
            <div class="px-5 py-10 text-center text-gray-400 text-sm">Loading events…</div>
          </template>

          <template x-if="!loading && events.length === 0">
            <div class="px-5 py-10 text-center text-gray-400 text-sm">No events found for this session.</div>
          </template>

          <!-- Timeline list -->
          <div class="divide-y divide-gray-50">
            <template x-for="(ev, idx) in events" :key="ev.event_id || idx">
              <div class="px-5 py-3 hover:bg-gray-50">
                <div class="flex items-start gap-4">
                  <!-- Timeline dot -->
                  <div class="flex flex-col items-center mt-1 flex-shrink-0">
                    <div class="w-2.5 h-2.5 rounded-full"
                      :class="ev.event_type?.includes('BLOCKED') ? 'bg-red-400' :
                              ev.event_type?.includes('APPROVED') ? 'bg-green-400' :
                              ev.event_type?.includes('GATE') ? 'bg-amber-400' : 'bg-indigo-400'">
                    </div>
                    <div x-show="idx < events.length - 1" class="w-px flex-1 mt-1 bg-gray-200" style="height:24px"></div>
                  </div>

                  <!-- Event content -->
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                      <span class="text-sm font-medium text-gray-800" x-text="ev.event_type || '—'"></span>
                      <span x-show="ev.safety_category" x-html="safetyCategoryBadge(ev.safety_category)"></span>
                    </div>
                    <div class="flex gap-3 text-xs text-gray-400">
                      <span x-text="fmtDate(ev.timestamp)"></span>
                      <span x-show="ev.element_type" class="capitalize" x-text="(ev.element_type||'').replace('_',' ')"></span>
                      <span x-show="ev.zone_id" x-text="ev.zone_id"></span>
                    </div>
                    <!-- HMAC hash -->
                    <div x-show="ev.hmac_hash || ev.event_hash" class="mt-1">
                      <code class="text-xs text-gray-400 font-mono bg-gray-50 px-2 py-0.5 rounded"
                        x-text="`hash: ${(ev.hmac_hash || ev.event_hash || '').slice(0,16)}…`"></code>
                    </div>
                    <!-- Expanded details toggle -->
                    <div x-show="ev._open" class="mt-2 p-3 bg-gray-50 rounded-lg">
                      <pre class="text-xs text-gray-600 overflow-x-auto whitespace-pre-wrap"
                        x-text="JSON.stringify(ev, null, 2)"></pre>
                    </div>
                  </div>

                  <!-- Expand button -->
                  <button @click="ev._open = !ev._open"
                    class="text-xs text-gray-400 hover:text-indigo-600 flex-shrink-0">
                    <span x-text="ev._open ? '▲' : '▼'"></span>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

    </div>
  </main>
</div>

<script src="//unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
  function auditApp() {
    return {
      sidebarOpen:     false,
      user:            auth.user(),
      loading:         false,
      sessions:        [],
      selectedSession: new URLSearchParams(location.search).get('session') || '',
      events:          [],
      chainResult:     null,
      verifying:       false,

      async init() {
        if (!auth.require()) return;
        await this.loadSessions();
        if (this.selectedSession) await this.loadAudit();
      },

      async loadSessions() {
        try {
          const data = await api.listSessions();
          this.sessions = data?.sessions || [];
        } catch { this.sessions = []; }
      },

      async loadAudit() {
        if (!this.selectedSession) return;
        this.loading     = true;
        this.events      = [];
        this.chainResult = null;
        try {
          const data = await api.getAudit(this.selectedSession);
          this.events = (data?.events || []).map(e => ({ ...e, _open: false }));
        } catch (e) {
          console.warn('audit load failed', e);
        } finally {
          this.loading = false;
        }
      },

      async verifyChain() {
        if (!this.selectedSession) return;
        this.verifying = true;
        try {
          this.chainResult = await api.verifyChain(this.selectedSession);
          toast(
            this.chainResult.valid ? 'Chain intact ✓' : '⚠ Chain integrity failed!',
            this.chainResult.valid ? 'success' : 'error',
          );
        } catch (e) {
          toast('Chain verification failed', 'error');
        } finally {
          this.verifying = false;
        }
      },

      fmtDate, shortId, safetyCategoryBadge,
    };
  }
</script>
</body>
</html>
