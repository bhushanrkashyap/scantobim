[project]
name = "scan-to-bim-agent"
version = "0.1.0"
description = "Enterprise Agentic Scan-to-BIM — Proof of Value"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.12.0",
    "open3d>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "laspy[lazrs]>=2.5.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20.0",
    "ezdxf>=1.3.0",
    "ifcopenshell>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]
ai = [
    "openai>=1.50.0",
]
semantic = [
    "torch>=2.4.0",
    "timm>=1.0.0",
    "einops>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"
